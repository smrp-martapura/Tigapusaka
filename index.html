<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Toko - CV. Tiga Pusako Borneo</title>
    
    <!-- PWA CONFIGURATION -->
    <link rel="manifest" href="data:application/json;charset=utf-8,%7B%22short_name%22%3A%22Tiga%20Pusako%22%2C%22name%22%3A%22CV%20Tiga%20Pusako%20Borneo%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230f172a%22%2C%22theme_color%22%3A%22%232563eb%22%2C%22orientation%22%3A%22portrait%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fcdn-icons-png.flaticon.com%2F512%2F869%2F869636.png%22%2C%22type%22%3A%22image%252Fpng%22%2C%22sizes%22%3A%22512x512%22%7D%5D%7D">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="text-slate-800 antialiased">

    <!-- HEADER -->
    <header class="bg-white border-b border-slate-100 shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <h1 class="font-bold text-slate-950">CV. Tiga Pusako Borneo</h1>
            <button onclick="toggleAccessMode()" id="btnToggleMode" class="px-4 py-1.5 rounded-xl text-xs font-semibold bg-slate-900 text-white hover:bg-slate-800 transition">
                Masuk Admin
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <!-- METRICS -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
                <p class="text-[10px] font-bold text-slate-400 uppercase">Actual Sales</p>
                <h3 id="totalSalesAmount" class="text-lg font-bold text-slate-900">Rp 0</h3>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
                <p class="text-[10px] font-bold text-slate-400 uppercase">Actual GM%</p>
                <h3 id="actualGMPercent" class="text-lg font-bold text-emerald-600">0%</h3>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
                <p class="text-[10px] font-bold text-slate-400 uppercase">ACV Sales</p>
                <h3 id="avgACVPercent" class="text-lg font-bold text-blue-600">0%</h3>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
                <p class="text-[10px] font-bold text-slate-400 uppercase">Sisa Target</p>
                <h3 id="remainingTargetSales" class="text-lg font-bold text-red-500">Rp 0</h3>
            </div>
        </div>

        <!-- ANALISIS PROYEKSI -->
        <div class="mb-8 p-6 bg-blue-50 border border-blue-100 rounded-2xl shadow-inner">
            <h3 class="font-bold text-slate-900 mb-4 flex items-center gap-2"><i class="fa-solid fa-calculator text-blue-600"></i> Analisis Proyeksi Akhir Bulan</h3>
            <div id="aiInsightText" class="text-sm text-slate-700 leading-relaxed space-y-2">Memuat data analisis...</div>
        </div>

        <!-- PANEL ADMIN (TERSEMBUNYI) -->
        <div id="adminPanel" class="hidden mb-8 grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-2xl border border-blue-200 shadow-lg">
                <h3 class="font-bold mb-4">Input Sales</h3>
                <form id="salesForm" onsubmit="handleTransactionSubmit(event)" class="space-y-3">
                    <input type="date" id="txDate" required class="w-full p-2 border rounded-lg text-sm">
                    <input type="number" id="txTotal" placeholder="Nominal Sales (Rp)" required class="w-full p-2 border rounded-lg text-sm">
                    <button class="w-full py-2 bg-blue-600 text-white rounded-lg text-sm font-bold">Simpan</button>
                </form>
            </div>
            <div class="bg-white p-6 rounded-2xl border border-blue-200 shadow-lg">
                <h3 class="font-bold mb-4">Update Target</h3>
                <form onsubmit="handleUpdateTargets(event)" class="space-y-3">
                    <input type="number" id="targetSalesInput" placeholder="Target Bulanan (Rp)" required class="w-full p-2 border rounded-lg text-sm">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="targetGMInput" placeholder="Target GM %" step="0.1" required class="w-full p-2 border rounded-lg text-sm">
                        <input type="number" id="actualGMInput" placeholder="Actual GM %" step="0.1" required class="w-full p-2 border rounded-lg text-sm">
                    </div>
                    <button class="w-full py-2 bg-indigo-600 text-white rounded-lg text-sm font-bold">Simpan Target</button>
                </form>
            </div>
        </div>

        <!-- GRAFIK -->
        <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm mb-8">
            <h3 class="font-bold mb-6">Tren Penjualan</h3>
            <div class="h-64"><canvas id="salesChart"></canvas></div>
        </div>
    </main>

    <!-- FIREBASE SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC0vc5NmxqXAmR7FGQIRqX-NcknIuCZpIU",
            databaseURL: "https://tiga-pusaka-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "tiga-pusaka"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let storeTargets = { targetSales: 0, targetGM: 0, actualGMAvg: 0 };
        let transactions = [];
        let isAdmin = false;
        let salesChart = null;

        function init() {
            document.getElementById('txDate').value = new Date().toISOString().split('T')[0];
            db.ref("store_config/targets").on("value", s => { if(s.val()) storeTargets = s.val(); updateUI(); });
            db.ref("transactions").on("value", s => {
                transactions = [];
                s.forEach(child => transactions.push({id: child.key, ...child.val()}));
                updateUI();
            });
        }

        function updateUI() {
            let totalSales = transactions.reduce((sum, t) => sum + t.total, 0);
            document.getElementById('totalSalesAmount').innerText = "Rp " + totalSales.toLocaleString('id-ID');
            document.getElementById('actualGMPercent').innerText = storeTargets.actualGMAvg + "%";
            document.getElementById('avgACVPercent').innerText = Math.round((totalSales/storeTargets.targetSales)*100) + "%";
            document.getElementById('remainingTargetSales').innerText = "Rp " + Math.max(0, storeTargets.targetSales - totalSales).toLocaleString('id-ID');
            
            generateAnalysisInsight(totalSales);
            renderChart();
        }

        function generateAnalysisInsight(totalSales) {
            const today = new Date();
            const daysInMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
            const dayOfMonth = today.getDate();
            const remainingDays = daysInMonth - dayOfMonth;
            const avgDailySales = dayOfMonth > 0 ? (totalSales / dayOfMonth) : 0;
            const projectedEndSales = totalSales + (avgDailySales * remainingDays);
            const remainingTargetSales = Math.max(0, storeTargets.targetSales - totalSales);
            const requiredDailySales = remainingDays > 0 ? (remainingTargetSales / remainingDays) : 0;
            const projectedGMRupiah = (projectedEndSales * (storeTargets.actualGMAvg / 100));

            let html = `
                <p>• <strong>Estimasi Penjualan Akhir Bulan:</strong> Rp ${Math.round(projectedEndSales).toLocaleString('id-ID')}</p>
                <p>• <strong>Target Sisa yang harus dikejar:</strong> <span class="text-red-500 font-bold">Rp ${remainingTargetSales.toLocaleString('id-ID')}</span></p>
                <p>• <strong>Target Harian (untuk sisa ${remainingDays} hari):</strong> <span class="text-blue-600 font-bold">Rp ${Math.round(requiredDailySales).toLocaleString('id-ID')}/hari</span></p>
                <p>• <strong>Estimasi Laba Kotor (GM) Akhir Bulan:</strong> <span class="text-emerald-600 font-bold">Rp ${Math.round(projectedGMRupiah).toLocaleString('id-ID')}</span></p>
            `;
            document.getElementById('aiInsightText').innerHTML = html;
        }

        function renderChart() {
            const ctx = document.getElementById('salesChart').getContext('2d');
            if(salesChart) salesChart.destroy();
            salesChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: transactions.map(t => t.date.slice(-2)),
                    datasets: [{ label: 'Sales (Rp)', data: transactions.map(t => t.total), borderColor: '#3b82f6', tension: 0.3 }]
                }
            });
        }

        function toggleAccessMode() {
            const pin = prompt("Masukkan PIN Admin:");
            if(pin === "19012226") {
                isAdmin = !isAdmin;
                document.getElementById('adminPanel').classList.toggle('hidden', !isAdmin);
                document.getElementById('btnToggleMode').innerText = isAdmin ? "Keluar Admin" : "Masuk Admin";
            } else { alert("PIN Salah!"); }
        }

        function handleTransactionSubmit(e) {
            e.preventDefault();
            db.ref("transactions").push({date: document.getElementById('txDate').value, total: parseFloat(document.getElementById('txTotal').value)});
        }

        function handleUpdateTargets(e) {
            e.preventDefault();
            db.ref("store_config/targets").set({
                targetSales: parseFloat(document.getElementById('targetSalesInput').value),
                targetGM: parseFloat(document.getElementById('targetGMInput').value),
                actualGMAvg: parseFloat(document.getElementById('actualGMInput').value)
            });
        }

        window.onload = init;
    </script>
</body>
</html>
